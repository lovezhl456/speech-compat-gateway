server.address=127.0.0.1
server.port=${COMPAT_PORT:18120}
server.error.include-message=never
server.error.include-stacktrace=never
spring.main.banner-mode=off
compat.asr-limit=${COMPAT_ASR_LIMIT:64}
compat.tts-limit=${COMPAT_TTS_LIMIT:64}
compat.tts-idle-limit=${COMPAT_TTS_IDLE_LIMIT:4}
compat.asr-result-timeout-ms=${COMPAT_ASR_RESULT_TIMEOUT_MS:12000}
compat.tts-timeouts.ready-ms=${COMPAT_TTS_READY_TIMEOUT_MS:5000}
compat.tts-timeouts.first-audio-ms=${COMPAT_TTS_FIRST_AUDIO_TIMEOUT_MS:6000}
compat.tts-timeouts.audio-idle-ms=${COMPAT_TTS_AUDIO_IDLE_TIMEOUT_MS:5000}
compat.tts-timeouts.total-ms=${COMPAT_TTS_TOTAL_TIMEOUT_MS:30000}
